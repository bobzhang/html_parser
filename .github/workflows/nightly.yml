name: Nightly CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: MoonBit nightly checks
    runs-on: ubuntu-latest
    # Advisory, not a gate. MoonBit moves fast enough that nightly can break on
    # toolchain drift alone, which says nothing about the change under review.
    # Stable is the release this package is published against, so `ci.yml` is
    # the job that decides; this one is an early warning. Read its log when it
    # goes red — a real regression usually shows up in both.
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit nightly
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- nightly
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show MoonBit version
        run: moon version --all

      - name: Update MoonBit registry
        run: moon update

      - name: Run repository checks
        run: moon run --target native scripts/check_ci.mbtx --skip-without-credentials
